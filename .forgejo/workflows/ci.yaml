name: CI

on:
  push:
    branches: [ "rewrite/from-2026-07-03" ]
  pull_request:
    branches: [ "rewrite/from-2026-07-03" ]

jobs:
  ci:
    name: Build, Test & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: https://github.com/taiki-e/install-action@just

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Rust build artifacts & cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Playwright Browsers & System Dependencies
        run: |
          cd frontend
          bun install
          bun x playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            bun x playwright install chromium
          fi

      - name: Cache Nx computation results
        uses: actions/cache@v4
        with:
          path: .nx
          key: ${{ runner.os }}-nx-${{ hashFiles('nx.json', '**/project.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ hashFiles('nx.json', '**/project.json') }}-
            ${{ runner.os }}-nx-

      - name: Cache WASM and Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            target/wasm32-wasip1
            dist
          key: ${{ runner.os }}-build-artifacts-${{ hashFiles('crates/**/src/**', 'crates/**/Cargo.toml', 'frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-artifacts-

      - name: Run Rust unit & integration tests
        run: cargo test --workspace --release

      - name: Build panoapps & server
        run: just build

      - name: Run Playwright E2E tests
        run: just test-e2e
