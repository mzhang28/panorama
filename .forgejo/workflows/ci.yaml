name: CI

on:
  push:
    branches: [ "rewrite/from-2026-07-03" ]
  pull_request:
    branches: [ "rewrite/from-2026-07-03" ]

jobs:
  ci:
    name: Build, Test & E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install click

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache Rust build artifacts & cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers & System Dependencies
        run: |
          cd frontend
          npm ci || npm install
          npx playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi

      - name: Cache WASM and Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            target/wasm32-wasip1
            dist
          key: ${{ runner.os }}-build-artifacts-${{ hashFiles('crates/**/src/**', 'crates/**/Cargo.toml', 'frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-build-artifacts-

      - name: Type check Rust & Frontend
        run: |
          cargo check --workspace
          cd frontend && npx tsc --noEmit

      - name: Run Rust unit & integration tests
        run: cargo test --workspace

      - name: Build everything (frontend, WASM plugins, server & .panoapps)
        run: just build

      - name: Run Playwright E2E tests
        run: just test-e2e
