# Panorama — single-service stack
# Build: docker compose build
# Run:   docker compose up -d
# Logs:  docker compose logs -f
# Stop:  docker compose down

services:
  panorama:
    image: forgejo.apps.mzhang.io/michael/panorama:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panorama
    ports:
      - "3000:3000"
    volumes:
      - panorama-data:/var/lib/panorama/data
    environment:
      - PANORAMA_DATA_DIR=/var/lib/panorama/data
      - PANORAMA_LISTEN=0.0.0.0:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/plugins"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  panorama-data:
    driver: local
