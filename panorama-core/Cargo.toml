[package]
name = "panorama-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "panorama-daemon"
path = "src/main.rs"

[lib]
name = "panorama_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = { version = "1.0.99", features = ["backtrace"] }
axum = { version = "0.8.4", features = ["http2", "ws", "macros"] }
clap = { version = "4.5.45", features = ["derive"] }
cxx = "1.0.168"
graphql-parser = "0.4.1"
mlua = { version = "0.11.2", features = ["lua54", "serde", "vendored"] }
serde_yaml = "0.9"
once_cell = "1.19"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "sqlite",
    "tls-none",
    "tls-rustls",
] }
tokio = { version = "1.47.1", features = ["full"] }
uuid = { version = "1.18.0", features = ["v7"] }

[build-dependencies]
cxx-build = "1.0.168"
