[package]
name = "panorama-core"
version = "0.1.0"
edition = "2024"

[dependencies]
derivative = "2.2.0"
mlua = { version = "0.11.5", features = ["lua54", "vendored", "send", "serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.11"
serde_json = "1.0.148"
surrealdb = { version = "2.4.0", features = ["kv-mem", "kv-rocksdb", "protocol-ws"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
