[package]
name = "panorama-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
derivative = "2.2.0"
mlua = { version = "0.11.5", features = ["lua54", "vendored", "send", "serialize", "async"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.11"
serde_json = "1.0.148"
surrealdb = { version = "3.0.0-beta.1", features = ["kv-mem", "kv-rocksdb", "protocol-ws"] }
surrealdb-types = "3.0.0-beta.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
