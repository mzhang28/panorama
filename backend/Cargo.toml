[package]
name = "panorama-backend"
edition = "2024"
version.workspace = true
license.workspace = true
authors.workspace = true

[features]
static-build = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
anyhow = "1.0.95"
axum = { version = "0.8.1", features = [
  "json",
  "http2",
  "macros",
  "ws",
  "multipart",
] }
chrono = "0.4.30"
clap = { version = "4.5.30", features = ["derive", "env"] }
cmd_lib = "1.9.5"
dirs = "6.0.0"
futures = "0.3.31"
icalendar = { version = "0.16.12", features = [
  "serde",
  "serde_json",
  "chrono-tz",
] }
lalrpop-util = { version = "0.22.1", features = ["lexer"] }
object_store = "0.11.2"
reqwest = { version = "0.12.12", features = ["stream"] }
rusqlite = { version = "0.32", features = ["functions"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
sqlx = { version = "0.8.3", features = [
  "runtime-tokio",
  "tls-rustls",
  "sqlite",
  "chrono",
] }
tantivy = { version = "0.22.0", features = ["zstd"] }
tempfile = "3.17.1"
tokio = { version = "1.43.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.13", features = ["full", "io", "io-util"] }
tower-http = { version = "0.6.2", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
ts-rs = { version = "10.1.0", features = ["serde-json-impl"] }
uuid = { version = "1.12.1", features = ["v7"] }
zip = "2.2.2"
zip-extract = "0.2.1"

rust-embed = { version = "8.5.0", optional = true, features = [
  "interpolate-folder-path",
  "compression",
] }
mime_guess = { version = "2.0.5", optional = true }

[build-dependencies]
lalrpop = "0.22.1"
