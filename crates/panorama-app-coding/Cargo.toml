[package]
name = "panorama-app-coding"
version = "0.1.0"
edition = "2021"

[dependencies]
panorama-core = { path = "../panorama-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
matchit = "0.8"

[[bin]]
name = "coding"
path = "src/wasm_main.rs"
