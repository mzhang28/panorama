[package]
name = "wasm-plugins"
version = "0.1.0"
edition = "2021"

# Each plugin is a separate bin target compiled to wasm32-wasip1

[[bin]]
name = "journal"
path = "src/bin/journal.rs"

[[bin]]
name = "wakatime"
path = "src/bin/wakatime.rs"

[[bin]]
name = "grafana"
path = "src/bin/grafana.rs"

[[bin]]
name = "trips"
path = "src/bin/trips.rs"

[[bin]]
name = "beli"
path = "src/bin/beli.rs"

[[bin]]
name = "subsonic"
path = "src/bin/subsonic.rs"

[[bin]]
name = "files"
path = "src/bin/files.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
