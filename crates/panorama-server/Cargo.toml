[package]
name = "panorama-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "panorama-server"
path = "src/main.rs"

[dependencies]
panorama-core = { path = "../panorama-core" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
mime = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
dashmap = "6"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
zip = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
wasmtime = "29"
wasmtime-wasi = "29"

[dev-dependencies]
tempfile = "3"
panorama-app-journal = { path = "../panorama-app-journal" }
panorama-app-wakatime = { path = "../panorama-app-wakatime" }
panorama-app-grafana = { path = "../panorama-app-grafana" }
panorama-app-trips = { path = "../panorama-app-trips" }
panorama-app-beli = { path = "../panorama-app-beli" }
panorama-app-subsonic = { path = "../panorama-app-subsonic" }
panorama-app-files = { path = "../panorama-app-files" }

[build-dependencies]
built = { version = "0.7", features = ["chrono"] }
